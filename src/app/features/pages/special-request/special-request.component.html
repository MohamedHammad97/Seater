<div class="bg-gray-50 pt-16">
    <div class="container mx-auto px-6 py-12 grid grid-cols-1 md:grid-cols-2 gap-10 items-center">

        <!-- Content -->
        <div class="flex flex-col space-y-6 text-left">
            <h1 class="font-extrabold leading-tight text-gray-900 text-4xl md:text-5xl">
                Seater's Special Requset Solution
            </h1>
            <p class="text-gray-600 text-lg leading-relaxed">
                Need a custom solution? Seater handles special transportation requests for both individuals and organizations—whether
                it’s a single vehicle or an entire fleet.
            </p>
        </div>

        <!-- Images -->
        <div class="md:grid md:grid-cols-2 gap-6 relative">
            <div>
                <img src="Screens/specialReguest1.png" alt="" class="w-full rounded-3xl">
            </div>
            <div>
                <img src="Screens/specialReguest2.png" alt="" class="w-full rounded-3xl">
            </div>
        </div>
    </div>

    <!--  Button -->
    <div class="px-7 md:px-16 pb-10 pt-5">
        <button (click)="goToSignin()"
            class="w-full bg-blue-600 text-white py-3 rounded-full transition hover:bg-blue-700 text-lg font-semibold">
            Book Now
        </button>
    </div>
</div>
