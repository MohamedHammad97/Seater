<h1 class="text-2xl font-semibold mb-6 text-seaterBlue2">Settings</h1>
<form class="bg-white p-6 rounded-2xl shadow w-full max-w-lg space-y-4">
    <div>
        <label class="block text-gray-600 mb-1">Company Name</label>
        <input type="text"
            class="w-full border-gray-300 rounded-lg p-2.5 focus:border-seaterBlue2 focus:ring-seaterBlue2"
            value="Seater Inc.">
    </div>
    <div>
        <label class="block text-gray-600 mb-1">Email</label>
        <input type="email"
            class="w-full border-gray-300 rounded-lg p-2.5 focus:border-seaterBlue2 focus:ring-seaterBlue2"
            value="admin@seater.com">
    </div>
    <div class="flex justify-end">
        <button type="submit"
            class="bg-gradient-to-r from-seaterBlue1 to-seaterBlue2 text-white px-4 py-2 rounded-lg shadow hover:opacity-90">
            Save Changes
        </button>
    </div>
</form>
